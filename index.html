    <script>
      // Compatibility shim for extension interceptors that attempt `window.fetch = ...`
      // in environments where window.fetch has only a getter.
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if redefine fails
        }
      })();
    </script>
